{% extends "base.html" %}
{% block tieu_de %}Xác nhận xóa{% endblock %}
{% block noi_dung %}
<div class="row justify-content-center"><div class="col-md-6">
  <div class="card shadow-sm border-danger"><div class="card-body">
    <h1 class="h5 text-danger">Xác nhận xóa</h1>
    <p>Bạn có chắc muốn xóa {{ ten_danh_muc|lower }} <strong>«{{ doi_tuong }}»</strong>? Thao tác này không thể hoàn tác.</p>
    <form method="post">{% csrf_token %}
      <button class="btn btn-danger">Xóa</button>
      <a class="btn btn-outline-secondary" href="{{ url_ds }}">Hủy</a>
    </form>
  </div></div>
</div></div>
{% endblock %}
